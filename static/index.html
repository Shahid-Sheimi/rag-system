<!doctype html><html><head><meta charset="utf-8"><title>RAG Knowledge Base</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:system-ui,sans-serif;max-width:1100px;margin:2rem auto;padding:0 1rem;color:#222}
.card{border:1px solid #ddd;border-radius:10px;padding:1rem;margin-bottom:1rem}
button{padding:.5rem 1rem;border:0;border-radius:6px;background:#2d5be3;color:#fff;cursor:pointer;margin-right:.35rem}
input[type=text],select{padding:.45rem .5rem;border:1px solid #ccc;border-radius:6px}
input[type=text]{min-width:12rem}
pre{white-space:pre-wrap;background:#f6f6f6;padding:.7rem;border-radius:6px}
small{color:#666}
table{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:.75rem}
th,td{border:1px solid #ddd;padding:.5rem .6rem;text-align:left;vertical-align:top}
th{background:#f0f4ff;position:sticky;top:0}
tr:nth-child(even){background:#fafafa}
.desc{max-width:520px;line-height:1.45}
.toolbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.5rem}
#sqlErr{color:#b00020;margin-top:.5rem}
</style></head><body>
<h2>RAG Knowledge Base</h2>



<div class="card"><b>Upload</b> (PDF, CSV, DOCX, TXT, MD)<br><br>
<input type="file" id="files" multiple> <button onclick="up()">Upload</button>
<button onclick="syncSql()" style="background:#555">Ingest SQL → knowledge base</button>
<small> — embeds all tables in sql_sources.yaml into Qdrant (files stay indexed too)</small><pre id="upOut"></pre></div>
<div class="card"><b>Ask the knowledge base</b><br>
<small>Default searches <b>uploaded files + SQL rows</b> together. Choose <b>sql</b> or <b>file</b> to limit.</small><br><br>
<input type="text" id="q" placeholder="e.g. What HR modules does PeopleManager include?" onkeydown="if(event.key==='Enter')ask()">
<select id="st"><option value="">files + SQL</option><option>file</option><option>sql</option></select>
<button onclick="ask()">Ask</button><div id="ans"></div></div>
<div class="card"><b>Indexed</b> <button onclick="stats()" style="background:#555">refresh</button><pre id="stats"></pre></div>
<script>
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}

async function loadSqlTable(){
  const err=document.getElementById('sqlErr');
  const wrap=document.getElementById('sqlTableWrap');
  const project=sqlProject.value.trim();
  err.textContent='';
  wrap.innerHTML='<p><small>Loading from database…</small></p>';
  const qs=project?('?project_name='+encodeURIComponent(project)):'';
  try{
    const r=await fetch('/sql/pm-rag-tools'+qs);
    if(!r.ok) throw new Error(await r.text());
    const d=await r.json();
    const rows=d.rows||[];
    if(!rows.length){
      wrap.innerHTML='<p><small>No rows found.</small></p>';
      return;
    }
    let html='<p><small>'+rows.length+' row(s) from '+esc(d.source)+(d.project_name?' — filter: '+esc(d.project_name):'')+'</small></p>';
    html+='<table><thead><tr><th>Id</th><th>Description</th><th>ProjectName</th><th>Level</th><th>LevelName</th></tr></thead><tbody>';
    for(const row of rows){
      html+='<tr><td>'+esc(row.Id)+'</td><td class="desc">'+esc(row.Description)+'</td><td>'+esc(row.ProjectName)+'</td><td>'+esc(row.Level)+'</td><td>'+esc(row.LevelName||'')+'</td></tr>';
    }
    html+='</tbody></table>';
    wrap.innerHTML=html;
  }catch(e){
    err.textContent='Could not load SQL data: '+e.message;
    wrap.innerHTML='';
  }
}

async function up(){const fd=new FormData();for(const f of files.files)fd.append('files',f);
 upOut.textContent='Uploading & indexing…';const r=await fetch('/upload',{method:'POST',body:fd});
 upOut.textContent=JSON.stringify(await r.json(),null,2);stats();loadSqlTable()}
async function syncSql(){upOut.textContent='Embedding SQL rows into knowledge base…';const r=await fetch('/sync/sql',{method:'POST'});
 const d=await r.json();upOut.textContent=JSON.stringify(d,null,2);stats()}
async function ask(){ans.textContent='Thinking…';
 const r=await fetch('/query',{method:'POST',headers:{'Content-Type':'application/json'},
 body:JSON.stringify({question:q.value,source_type:st.value||null})});const d=await r.json();
 ans.innerHTML='<pre></pre><small>Sources:</small><ul></ul>';ans.querySelector('pre').textContent=d.answer;
 d.sources.forEach((s,i)=>{const li=document.createElement('li');
 li.textContent=`[${i+1}] ${s.doc_id} (score ${s.score.toFixed(2)})`;ans.querySelector('ul').appendChild(li)})}
async function stats(){stats_.textContent=JSON.stringify(await (await fetch('/stats')).json(),null,2)}
const stats_=document.getElementById('stats');
stats();
loadSqlTable();
</script></body></html>
